name: Fix lost-found phone display

on:
  push:
    branches:
      - fix/lost-found-phone-last4

permissions:
  contents: write

jobs:
  fix-phone-display:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/lost-found-phone-last4

      - name: Update public Lost and Found phone handling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/pages/lost-and-found.astro")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  '''    function getVisibleCells(row) {
                return VISIBLE_SOURCE_INDICES.map((sourceIndex) => row[sourceIndex] ?? null);
              }''',
                  '''    function getCellText(cell) {
                if (!cell) return "";

                if (cell.f !== null && cell.f !== undefined && cell.f !== "") {
                  return String(cell.f).trim();
                }

                return String(cell.v ?? "").trim();
              }

              function getVisibleCells(row) {
                return VISIBLE_SOURCE_INDICES.map((sourceIndex) => {
                  if (sourceIndex !== 4) {
                    return row[sourceIndex] ?? null;
                  }

                  const existingLast4 = row[4] ?? null;

                  if (getCellText(existingLast4)) {
                    return existingLast4;
                  }

                  const phoneDigits = getCellText(row[7]).replace(/\\D/g, "");

                  if (!phoneDigits) {
                    return null;
                  }

                  const last4 = phoneDigits.slice(-4).padStart(4, "0");

                  return {
                    v: last4,
                    f: last4,
                  };
                });
              }''',
                  "visible-cell fallback",
              ),
              (
                  '        const tq = encodeURIComponent("select A,B,C,D,E,F,G");',
                  '        const tq = encodeURIComponent("select A,B,C,D,E,F,G,H");',
                  "sheet query",
              ),
              (
                  '''            const cells = Array.isArray(row?.c) ? row.c.slice(0, 7) : [];
                        while (cells.length < 7) cells.push(null);''',
                  '''            const cells = Array.isArray(row?.c) ? row.c.slice(0, 8) : [];
                        while (cells.length < 8) cells.push(null);''',
                  "row width",
              ),
          ]

          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"Expected exactly one {label} match; found {count}.")
              text = text.replace(old, new)

          path.write_text(text, encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-lost-found-phone.yml
          git add src/pages/lost-and-found.astro
          git commit -m "Fix missing public phone last-four digits"
          git push origin HEAD:fix/lost-found-phone-last4
