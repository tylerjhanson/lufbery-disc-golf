name: Validate League Data

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/data/hcp.csv'
      - 'src/data/wkres.csv'
      - 'src/data/handicap-tag-history.csv'
      - 'scripts/validate-league-data.mjs'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - 'src/data/hcp.csv'
      - 'src/data/wkres.csv'
      - 'src/data/handicap-tag-history.csv'
      - 'scripts/validate-league-data.mjs'
      - 'package.json'
      - 'package-lock.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate league CSV data
        run: npm run validate-league-data

      - name: Build website
        run: npm run build
